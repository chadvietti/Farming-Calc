<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Crop Optimizer — Berry Farm Calculator</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #0d0d1f; font-family: monospace; color: #e2e8f0; }
    input[type=number]::-webkit-inner-spin-button,
    input[type=number]::-webkit-outer-spin-button { opacity: 1; }
    input, select, button { font-family: monospace; }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: #0d0d1f; }
    ::-webkit-scrollbar-thumb { background: #2a2a4a; border-radius: 3px; }
    select option { background: #1a1a2e; color: #e2e8f0; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useMemo } = React;

  // ── Flavor metadata ──────────────────────────────────────────────────────────
  const FLAVOR_META = {
    Spicy:  { very: "Very Spicy",  plain: "Plain Spicy",  bg: "#2a1200", border: "#7c3400", label: "#fb923c" },
    Sweet:  { very: "Very Sweet",  plain: "Plain Sweet",  bg: "#2a0a1a", border: "#7c1a4a", label: "#f472b6" },
    Bitter: { very: "Very Bitter", plain: "Plain Bitter", bg: "#0a2a0a", border: "#1a6a1a", label: "#4ade80" },
    Sour:   { very: "Very Sour",   plain: "Plain Sour",   bg: "#2a2200", border: "#6a5800", label: "#facc15" },
    Dry:    { very: "Very Dry",    plain: "Plain Dry",    bg: "#0a1a2a", border: "#1a4a7a", label: "#93c5fd" },
  };
  const SEED_TYPES = Object.values(FLAVOR_META).flatMap(f => [f.very, f.plain]);
  const SEED_FLAVOR = {};
  Object.entries(FLAVOR_META).forEach(([flavor, meta]) => {
    SEED_FLAVOR[meta.very]  = { flavor, quality: "Very",  ...meta };
    SEED_FLAVOR[meta.plain] = { flavor, quality: "Plain", ...meta };
  });

  // ── Berry groups ─────────────────────────────────────────────────────────────
  const BERRY_GROUPS = {
    "HP":      { label: "HP Restore",   color: "#f87171", berries: ["Figy","Wiki","Mago","Aguav","Iapapa"] },
    "EV":      { label: "EV Reset",     color: "#a78bfa", berries: ["Pomeg","Kelpsy","Qualot","Hondew","Grepa","Tamato"] },
    "25%":     { label: "25% Berries",  color: "#fbbf24", berries: ["Liechi","Ganlon","Salac","Petaya","Apicot","Lansat","Starf","Enigma","Micle","Custap"] },
    "Halve":   { label: "Halve Damage", color: "#60a5fa", berries: ["Occa","Passho","Wacan","Rindo","Yache","Chople","Kebia","Shuca","Coba","Payapa","Tanga","Charti","Kasib","Colbur","Babiri","Chilan","Haban"] },
    "Damage":  { label: "Damage",       color: "#f97316", berries: ["Jaboca","Rowap"] },
    "Restore": { label: "Restore",      color: "#6ee7b7", berries: ["Lum","Sitrus","Leppa"] },
    "Maniac":  { label: "Maniac",       color: "#94a3b8", berries: ["Watmel","Nomel","Magost","Cornn","Durin","Belue","Rabuta","Spelon","Pamtre"] },
  };
  const berryGroupMap = {};
  Object.entries(BERRY_GROUPS).forEach(([key, g]) => g.berries.forEach(b => { berryGroupMap[b] = key; }));

  // ── Featured order (shown first in results) ───────────────────────────────
  const FEATURED_ORDER = ["Leppa","Sitrus","Lum","Occa","Chople","Rindo","Yache","Kasib","Haban","Charti","Jaboca","Rowap","Starf","Salac","Liechi","Petaya"];

  // ── Seed prices ───────────────────────────────────────────────────────────
  const DEFAULT_SEED_PRICES = {
    "Very Spicy": 1750, "Plain Spicy": 780,
    "Very Sweet": 1750, "Plain Sweet": 780,
    "Very Bitter":1750, "Plain Bitter":780,
    "Very Sour":  1750, "Plain Sour":  780,
    "Very Dry":   1750, "Plain Dry":   780,
  };

  // ── Species list (sorted by growHours, then name) ────────────────────────
  // marketPrice default = basePrice + 100 (set as string so field shows it)
  const S = (id, name, bpt, base, gh, hd, seeds) => ({
    id, name,
    berriesPerTree: bpt,
    basePrice: base,
    marketPrice: String(base + 100),
    growHours: gh,
    harvestDays: hd,
    seeds,
  });
  const VSp = "Very Spicy", PSp = "Plain Spicy";
  const VSw = "Very Sweet",  PSw = "Plain Sweet";
  const VB  = "Very Bitter", PB  = "Plain Bitter";
  const VSo = "Very Sour",   PSo = "Plain Sour";
  const VD  = "Very Dry",    PD  = "Plain Dry";

  const DEFAULT_SPECIES = [
    // ── 20h / 1-day ──
    S( 1,"Figy",    5.5, 600, 20, 1, {[VSp]:1,[PSp]:2}),
    S( 2,"Mago",    5.5, 600, 20, 1, {[VSw]:1,[PSw]:2}),
    S( 3,"Aguav",   5.5, 600, 20, 1, {[VB]:1, [PB]:2}),
    S( 4,"Iapapa",  5.5, 600, 20, 1, {[VSo]:1,[PSo]:2}),
    S( 5,"Wiki",    5.5, 600, 20, 1, {[VD]:1, [PD]:2}),
    S( 6,"Leppa",   6,   600, 20, 1, {[VSp]:1,[PSw]:1,[PB]:1}),
    S( 7,"Rabuta",  5.5, 600, 20, 1, {[VB]:1, [PSo]:1}),
    S( 8,"Nomel",   5.5, 600, 20, 1, {[VSo]:1,[PSo]:1,[PSp]:1}),
    S( 9,"Magost",  5.5, 600, 20, 1, {[PB]:1, [VSw]:1,[PSw]:1}),
    S(10,"Cornn",   5.5, 600, 20, 1, {[VD]:1, [PD]:1, [PSw]:1}),
    // ── 42h / 2-day ──
    S(11,"Occa",    8,   700, 42, 2, {[VSp]:1,[PSp]:1,[VSw]:1}),
    S(12,"Wacan",   8,   700, 42, 2, {[VSo]:1,[VSw]:1,[PSw]:1}),
    S(13,"Rindo",   8,   700, 42, 2, {[VB]:1, [PB]:1, [VSp]:1}),
    S(14,"Yache",   8,   700, 42, 2, {[VD]:1, [VSo]:1,[PSo]:1}),
    S(15,"Chople",  8,   700, 42, 2, {[VB]:1, [VSp]:1,[PSp]:1}),
    S(16,"Kebia",   8,   700, 42, 2, {[VD]:1, [PD]:1, [VSo]:1}),
    S(17,"Shuca",   8,   700, 42, 2, {[VSp]:1,[VSw]:1,[PSw]:1}),
    S(18,"Coba",    8,   700, 42, 2, {[VB]:1, [PB]:1, [VD]:1}),
    S(19,"Payapa",  8,   700, 42, 2, {[VSo]:1,[PSo]:1,[VSw]:1}),
    S(20,"Tanga",   8,   700, 42, 2, {[VSo]:1,[VSp]:1,[PSp]:1}),
    S(21,"Colbur",  8,   700, 42, 2, {[VSo]:1,[PSo]:1,[VSp]:1}),
    S(22,"Babiri",  8,   700, 42, 2, {[VD]:1, [VSp]:1,[PSp]:1}),
    S(23,"Chilan",  8,   700, 42, 2, {[VD]:1, [PD]:1, [VSw]:1}),
    S(24,"Charti",  8,   700, 42, 2, {[VD]:1, [PD]:1, [VSp]:1}),
    S(25,"Kasib",   8,   700, 42, 2, {[VD]:1, [VSw]:1,[PSw]:1}),
    S(26,"Haban",   8,   700, 42, 2, {[VB]:1, [PB]:1, [VSw]:1}),
    S(27,"Watmel",  8,   700, 42, 2, {[VSw]:2,[PB]:1}),
    S(28,"Spelon",  8,   700, 42, 2, {[PD]:1, [VSp]:2}),
    S(29,"Enigma",  8.5, 700, 42, 2, {[VD]:1, [VSp]:2}),
    S(30,"Durin",   8,   700, 42, 2, {[VB]:2, [PSo]:1}),
    S(31,"Belue",   8,   700, 42, 2, {[VSo]:2,[PSp]:1}),
    S(32,"Passho",  8,   700, 42, 2, {[VB]:1, [VD]:1, [PD]:1}),
    S(33,"Pamtre",  8,   700, 42, 2, {[VD]:2, [PSw]:1}),
    // ── 44h / 2-day ──
    S(34,"Pomeg",   8,   600, 44, 2, {[PB]:1, [VSp]:1,[PSp]:1}),
    S(35,"Kelpsy",  8,   600, 44, 2, {[VD]:1, [PD]:1, [PSo]:1}),
    S(36,"Qualot",  8,   600, 44, 2, {[PSp]:1,[VSw]:1,[PSw]:1}),
    S(37,"Hondew",  8,   600, 44, 2, {[VB]:1, [PB]:1, [PD]:1}),
    S(38,"Grepa",   8,   600, 44, 2, {[VSo]:1,[PSo]:1,[PSw]:1}),
    S(39,"Tamato",  8,   600, 44, 2, {[PD]:1, [VSp]:1,[PSp]:1}),
    S(40,"Jaboca",  8.5, 700, 44, 2, {[VB]:2, [VSo]:1}),
    S(41,"Rowap",   8.5, 700, 44, 2, {[VSo]:2,[VSp]:1}),
    S(42,"Custap",  8.5, 700, 44, 2, {[VB]:1, [VSw]:2}),
    S(43,"Sitrus",  8.5, 800, 44, 2, {[VB]:1, [VSo]:1,[VSw]:1}),
    S(44,"Micle",   8.5, 700, 44, 2, {[VD]:2, [VSw]:1}),
    S(45,"Lum",     8.5, 800, 44, 2, {[VD]:1, [VSp]:1,[VSw]:1}),
    // ── 67h / 3-day ──
    S(46,"Liechi",  11.5,550, 67, 3, {[PD]:1, [VSp]:1,[VSw]:1}),
    S(47,"Ganlon",  11.5,550, 67, 3, {[VB]:1, [VD]:1, [PSw]:1}),
    S(48,"Salac",   11.5,550, 67, 3, {[PB]:1, [VSo]:1,[VSw]:1}),
    S(49,"Petaya",  11.5,550, 67, 3, {[VB]:1, [PSo]:1,[VSp]:1}),
    S(50,"Apicot",  11.5,550, 67, 3, {[VD]:1, [VSo]:1,[PSp]:1}),
    S(51,"Lansat",  12,  600, 67, 3, {[VSo]:1,[VSp]:1,[VSw]:1}),
    S(52,"Starf",   12,  600, 67, 3, {[VB]:1, [VD]:1, [VSw]:1}),
  ];

  const PLOTS = 156;
  const LISTING_FEE = 100;

  const COL = {
    bg: "#0d0d1f", card: "#11112a", border: "#1e1e3f",
    accent: "#6ee7b7", purple: "#c084fc", gold: "#fbbf24",
    red: "#f87171", muted: "#6b7280", text: "#e2e8f0",
  };
  const fs = {
    background: "#1a1a2e", border: "1px solid #2a2a4a", borderRadius: "4px",
    color: COL.text, padding: "4px 8px", fontSize: "13px", fontFamily: "monospace", width: "100%",
  };
  function fmt(n) { return Math.round(n).toLocaleString(); }

  // ── calcMetrics ──────────────────────────────────────────────────────────────
  function calcMetrics(sp, seedPrices) {
    const mp = sp.marketPrice !== "" ? Number(sp.marketPrice) : sp.basePrice + 100;
    const marketNet      = mp - LISTING_FEE;
    const effectivePrice = marketNet;          // always use market net (default = base price)
    const revenue        = sp.berriesPerTree * PLOTS * effectivePrice;
    const seedCost       = Object.entries(sp.seeds).reduce(
      (s, [seed, qty]) => s + qty * PLOTS * (seedPrices[seed] || 0), 0);
    const netProfit   = revenue - seedCost;
    const margin      = revenue > 0 ? (netProfit / revenue) * 100 : 0;
    const theorDays   = sp.growHours / 24;
    const practicalDays = sp.harvestDays || Math.ceil(theorDays);
    const cyclesPer48 = 48 / (practicalDays * 24);
    const netPer48h   = netProfit * cyclesPer48;
    const waitPenalty = practicalDays > theorDays + 0.01;
    // base-only net (ignores market price, used for Top Base section)
    const baseRevenue   = sp.berriesPerTree * PLOTS * sp.basePrice;
    const baseNet       = baseRevenue - seedCost;
    const baseNet48h    = baseNet * cyclesPer48;
    return { revenue, seedCost, netProfit, margin, cyclesPer48, netPer48h,
             effectivePrice, marketNet, mp,
             theorDays, practicalDays, waitPenalty, baseNet48h };
  }

  // ── SeedChip ─────────────────────────────────────────────────────────────────
  function SeedChip({ seed }) {
    const meta = SEED_FLAVOR[seed];
    if (!meta) return null;
    return <span style={{ display:"inline-block", background:meta.bg, border:`1px solid ${meta.border}`,
      borderRadius:"4px", padding:"1px 6px", fontSize:"11px", color:meta.label,
      fontFamily:"monospace", whiteSpace:"nowrap" }}>{seed}</span>;
  }

  // ── GroupBadge ───────────────────────────────────────────────────────────────
  function GroupBadge({ name }) {
    const key  = berryGroupMap[name];
    const meta = key ? BERRY_GROUPS[key] : null;
    if (!meta) return null;
    return <span style={{ fontSize:"10px", padding:"1px 6px", borderRadius:"3px",
      border:`1px solid ${meta.color}44`, color:meta.color,
      background:`${meta.color}18`, whiteSpace:"nowrap" }}>{meta.label}</span>;
  }

  // ── SeedPriceEditor ───────────────────────────────────────────────────────────
  function SeedPriceEditor({ seedPrices, onChange }) {
    return (
      <div style={{ display:"flex", flexDirection:"column", gap:"14px" }}>
        {Object.entries(FLAVOR_META).map(([flavor, meta]) => (
          <div key={flavor}>
            <div style={{ fontSize:"11px", fontWeight:"700", letterSpacing:"2px", textTransform:"uppercase",
              color:meta.label, marginBottom:"8px", borderBottom:`1px solid ${meta.border}`, paddingBottom:"4px" }}>{flavor}</div>
            <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px" }}>
              {[meta.very, meta.plain].map(seed => (
                <div key={seed} style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
                  <label style={{ fontSize:"11px", color:meta.label, opacity:0.85 }}>{seed.split(" ")[0]}</label>
                  <div style={{ display:"flex", alignItems:"center", gap:"4px" }}>
                    <span style={{ color:meta.label, fontSize:"13px" }}>$</span>
                    <input type="number" value={seedPrices[seed] ?? 0}
                      onChange={e => onChange(seed, Number(e.target.value))}
                      style={{ ...fs, background:meta.bg, border:`1px solid ${meta.border}` }} />
                  </div>
                </div>
              ))}
            </div>
          </div>
        ))}
      </div>
    );
  }

  // ── SpeciesEditor ─────────────────────────────────────────────────────────────
  function SpeciesEditor({ species, onUpdate, onRemove }) {
    const mp          = species.marketPrice !== "" ? Number(species.marketPrice) : species.basePrice + 100;
    const marketNet   = mp - LISTING_FEE;
    const theorDays   = species.growHours / 24;
    const practical   = species.harvestDays || Math.ceil(theorDays);
    const waitPenalty = practical > theorDays + 0.01;
    const cycles      = 48 / (practical * 24);
    return (
      <div style={{ background:"#12122a", border:"1px solid #2a2a4a", borderRadius:"8px", padding:"14px", marginBottom:"10px" }}>
        <div style={{ display:"flex", justifyContent:"space-between", alignItems:"center", marginBottom:"12px" }}>
          <div style={{ display:"flex", alignItems:"center", gap:"10px" }}>
            <input value={species.name} onChange={e => onUpdate({ ...species, name: e.target.value })}
              style={{ background:"transparent", border:"none", borderBottom:"1px solid #3a3a6a",
                color:COL.purple, fontSize:"14px", fontWeight:"700", width:"160px" }} />
            <GroupBadge name={species.name} />
          </div>
          <button onClick={onRemove} style={{ background:"#3a1a1a", border:"1px solid #6a2a2a",
            borderRadius:"4px", color:COL.red, fontSize:"11px", padding:"3px 10px", cursor:"pointer" }}>Remove</button>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"repeat(4, 1fr)", gap:"8px", marginBottom:"12px" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>Berries/tree</label>
            <input type="number" value={species.berriesPerTree}
              onChange={e => onUpdate({ ...species, berriesPerTree: Number(e.target.value) })} style={fs} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>
              Grow hrs <span style={{ color:"#4a4a6a" }}>({theorDays % 1 === 0 ? theorDays : theorDays.toFixed(2)}d)</span>
            </label>
            <input type="number" value={species.growHours}
              onChange={e => onUpdate({ ...species, growHours: Number(e.target.value) })} style={fs} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:waitPenalty ? COL.gold : COL.muted }}>
              Harvest days {waitPenalty && <span style={{ fontSize:"10px" }}>⚠ idle</span>}
            </label>
            <input type="number" min="0.5" step="0.5" value={practical}
              onChange={e => onUpdate({ ...species, harvestDays: Number(e.target.value) })}
              style={{ ...fs, background:waitPenalty ? "#1a1a00" : "#1a1a2e",
                border:`1px solid ${waitPenalty ? "#5a5a00" : "#2a2a4a"}` }} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>Cycles / 48h</label>
            <div style={{ background:"#0a1a0a", border:"1px solid #1a4a1a", borderRadius:"4px",
              color:COL.accent, padding:"5px 8px", fontSize:"13px" }}>
              {cycles % 1 === 0 ? cycles : cycles.toFixed(2)}×
            </div>
          </div>
        </div>
        <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"8px", marginBottom:"14px" }}>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>Base price / berry $</label>
            <input type="number" value={species.basePrice}
              onChange={e => onUpdate({ ...species, basePrice: Number(e.target.value),
                marketPrice: String(Number(e.target.value) + 100) })} style={fs} />
          </div>
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>
              Market price / berry $
              <span style={{ color:"#86efac", marginLeft:"6px" }}>→ ${marketNet} after fee</span>
            </label>
            <input type="number" value={mp}
              onChange={e => onUpdate({ ...species, marketPrice: e.target.value })}
              style={{ ...fs,
                background: mp !== species.basePrice + 100 ? "#0f2a0f" : "#1a1a2e",
                border:`1px solid ${mp !== species.basePrice + 100 ? "#2a6a2a" : "#2a2a4a"}`,
                color: mp !== species.basePrice + 100 ? "#86efac" : COL.text }} />
          </div>
        </div>
        <div style={{ fontSize:"11px", color:COL.muted, marginBottom:"8px" }}>Seeds per plot:</div>
        <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
          {SEED_TYPES.map(seed => {
            const meta = SEED_FLAVOR[seed];
            const val  = species.seeds[seed] || 0;
            return (
              <div key={seed} style={{ display:"flex", flexDirection:"column", alignItems:"center", gap:"3px",
                background:val>0 ? meta.bg : "transparent", border:`1px solid ${val>0 ? meta.border : "#1e1e3f"}`,
                borderRadius:"6px", padding:"5px 7px", minWidth:"54px" }}>
                <label style={{ fontSize:"9px", color:val>0 ? meta.label : "#4a4a6a",
                  textAlign:"center", lineHeight:"1.3" }}>
                  {seed.split(" ")[0]}<br />{seed.split(" ")[1]}
                </label>
                <input type="number" min="0" value={val}
                  onChange={e => {
                    const n = Number(e.target.value);
                    const s = { ...species.seeds };
                    if (n===0) delete s[seed]; else s[seed]=n;
                    onUpdate({ ...species, seeds: s });
                  }}
                  style={{ background:"transparent", border:"none",
                    borderBottom:`1px solid ${val>0 ? meta.border : "#2a2a4a"}`,
                    color:val>0 ? meta.label : "#6a6a8a", width:"38px", fontSize:"13px", textAlign:"center" }} />
              </div>
            );
          })}
        </div>
      </div>
    );
  }

  // ── BerryRow ─────────────────────────────────────────────────────────────────
  function BerryRow({ m, isBest, isFeatured }) {
    const rowBg = isBest ? "#0a1a12" : isFeatured ? "#0e0e22" : "transparent";
    return (
      <tr style={{ background:rowBg, borderBottom:`1px solid ${COL.border}` }}>
        <td style={{ padding:"9px 8px", whiteSpace:"nowrap" }}>
          <div style={{ display:"flex", alignItems:"center", gap:"6px" }}>
            <span style={{ color:isBest ? COL.accent : COL.purple, fontWeight:isBest ? "700" : "400" }}>
              {isBest ? "★ " : ""}{m.name}
            </span>
            <GroupBadge name={m.name} />
          </div>
        </td>
        <td style={{ padding:"9px 8px" }}>
          <div style={{ display:"flex", flexWrap:"wrap", gap:"3px" }}>
            {Object.keys(m.seeds).map(seed => <SeedChip key={seed} seed={seed} />)}
          </div>
        </td>
        <td style={{ padding:"9px 8px", textAlign:"right", color:COL.muted }}>${m.basePrice}</td>
        <td style={{ padding:"9px 8px", textAlign:"right",
          color: m.mp !== m.basePrice + 100 ? "#86efac" : COL.muted }}>${m.mp}</td>
        <td style={{ padding:"9px 8px", textAlign:"right", color:COL.text, fontWeight:"600" }}>
          ${m.effectivePrice}
          <div style={{ fontSize:"10px", color:COL.muted }}>after fee</div>
        </td>
        <td style={{ padding:"9px 8px", textAlign:"right" }}>${fmt(m.revenue)}</td>
        <td style={{ padding:"9px 8px", textAlign:"right", color:COL.red }}>${fmt(m.seedCost)}</td>
        <td style={{ padding:"9px 8px", textAlign:"right",
          color:m.netProfit >= 0 ? COL.accent : COL.red, fontWeight:"700" }}>${fmt(m.netProfit)}</td>
        <td style={{ padding:"9px 8px", textAlign:"right", color:COL.muted }}>{m.margin.toFixed(1)}%</td>
        <td style={{ padding:"9px 8px", textAlign:"right", color:COL.muted, whiteSpace:"nowrap" }}>
          <div>{m.growHours}h ({m.theorDays % 1 === 0 ? m.theorDays : m.theorDays.toFixed(2)}d)</div>
          <div style={{ fontSize:"10px", color:m.waitPenalty ? COL.gold : "#4a4a6a" }}>
            every {m.practicalDays}d{m.waitPenalty ? " ⚠" : ""}
          </div>
        </td>
        <td style={{ padding:"9px 8px", textAlign:"right",
          color:isBest ? COL.gold : COL.text, fontWeight:isBest ? "700" : "400" }}>
          ${fmt(m.netPer48h)}
          {m.cyclesPer48 !== 1 && (
            <div style={{ fontSize:"10px", color:COL.gold }}>
              {m.cyclesPer48 % 1 === 0 ? m.cyclesPer48 : m.cyclesPer48.toFixed(2)}× cycles
            </div>
          )}
        </td>
      </tr>
    );
  }

  // ── BerryTable ────────────────────────────────────────────────────────────────
  const TABLE_HEADERS = ["Berry","Seeds Required","Base $","Market $","Eff. Price","Revenue","Seed Cost","Net Profit","Margin","Grow / Harvest","Net/48h"];
  function BerryTable({ rows, bestId }) {
    return (
      <div style={{ overflowX:"auto" }}>
        <table style={{ width:"100%", borderCollapse:"collapse", fontSize:"12px", minWidth:"780px" }}>
          <thead>
            <tr style={{ color:COL.muted, borderBottom:`1px solid ${COL.border}` }}>
              {TABLE_HEADERS.map(h => (
                <th key={h} style={{ padding:"7px 8px",
                  textAlign:h==="Berry"||h==="Seeds Required" ? "left" : "right",
                  fontWeight:"400", whiteSpace:"nowrap" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.map((m, i) => (
              <BerryRow key={m.id} m={m}
                isBest={m.id === bestId}
                isFeatured={FEATURED_ORDER.includes(m.name)} />
            ))}
          </tbody>
        </table>
      </div>
    );
  }

  // ── SeedCracker ───────────────────────────────────────────────────────────────
  function SeedCracker({ seedPrices, speciesList }) {
    const firstBerry    = speciesList[0] || null;
    const initMarketPrice = firstBerry ? Number(firstBerry.marketPrice || firstBerry.basePrice + 100) : 600;
    const [selectedId,   setSelectedId]   = useState(firstBerry ? firstBerry.id : null);
    const [quantity,     setQuantity]     = useState(700);
    const [listingFeeOn, setListingFeeOn] = useState(true);
    const [outputs,      setOutputs]      = useState([
      { id:1, seed:"Very Spicy",  pct:30 },
      { id:2, seed:"Plain Spicy", pct:70 },
    ]);

    const TOOL_COST = 350;

    // Derive berry sell price from selected species market price
    const selectedSpecies = speciesList.find(s => s.id === selectedId) || null;
    const berryPrice = selectedSpecies
      ? Number(selectedSpecies.marketPrice || selectedSpecies.basePrice + 100)
      : 0;

    const totalPct = outputs.reduce((s,r) => s + Number(r.pct), 0);
    const pctOk    = Math.abs(totalPct - 100) < 0.01;

    const results = useMemo(() => {
      const toolTotal = quantity * TOOL_COST;
      const forgone   = quantity * berryPrice;
      const totalCost = toolTotal + forgone;
      const seedRev   = outputs.reduce((sum, row) => {
        const qty   = quantity * (Number(row.pct) / 100);
        const price = Math.max(0, (seedPrices[row.seed]||0) - (listingFeeOn ? LISTING_FEE : 0));
        return sum + qty * price;
      }, 0);
      return { toolTotal, forgone, totalCost, seedRev,
        netVsTool: seedRev - toolTotal, netVsOpp: seedRev - totalCost };
    }, [quantity, berryPrice, outputs, seedPrices, listingFeeOn]);

    return (
      <div style={{ background:COL.card, border:"1px solid #2a1a4a", borderRadius:"10px", padding:"16px", marginBottom:"20px" }}>
        <div style={{ fontSize:"11px", color:COL.purple, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"16px" }}>
          🔨 Seed Cracker — Berry → Seed Profitability
        </div>

        {/* Top inputs row */}
        <div style={{ display:"grid", gridTemplateColumns:"2fr 1fr 1fr", gap:"10px", marginBottom:"16px" }}>

          {/* Berry dropdown */}
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>Berry type</label>
            <select value={selectedId || ""}
              onChange={e => setSelectedId(Number(e.target.value))}
              style={{ ...fs, cursor:"pointer" }}>
              {speciesList.map(sp => (
                <option key={sp.id} value={sp.id}>{sp.name}</option>
              ))}
            </select>
          </div>

          {/* Berry sell price — read only, auto from market */}
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>
              Berry sell price $
              <span style={{ color:"#4a4a6a", marginLeft:"4px" }}>(market price)</span>
            </label>
            <div style={{ ...fs, background:"#0f1a0f", border:"1px solid #1a4a1a",
              color:"#86efac", display:"flex", alignItems:"center" }}>
              ${berryPrice.toLocaleString()}
            </div>
          </div>

          {/* Quantity */}
          <div style={{ display:"flex", flexDirection:"column", gap:"3px" }}>
            <label style={{ fontSize:"11px", color:COL.muted }}>Quantity cracked</label>
            <input type="number" value={quantity}
              onChange={e => setQuantity(Number(e.target.value))} style={fs} />
          </div>
        </div>

        {/* Info strip */}
        <div style={{ display:"flex", gap:"16px", marginBottom:"16px", fontSize:"11px", color:COL.muted,
          background:"#0d0d1f", borderRadius:"6px", padding:"8px 12px", flexWrap:"wrap" }}>
          <span>Tool cost: <span style={{ color:COL.red }}>$350/berry fixed</span></span>
          <span>Total tool cost: <span style={{ color:COL.red }}>${fmt(quantity * TOOL_COST)}</span></span>
          <span>Forgone sales: <span style={{ color:COL.red }}>${fmt(quantity * berryPrice)}</span></span>
        </div>

        {/* Seed outputs */}
        <div style={{ fontSize:"11px", color:COL.muted, marginBottom:"8px" }}>
          Seed outputs
          <span style={{ marginLeft:"8px", color:pctOk ? COL.accent : COL.red }}>
            (total: {totalPct.toFixed(1)}%{pctOk ? " ✓" : " — must sum to 100%"})
          </span>
        </div>
        <div style={{ display:"flex", flexDirection:"column", gap:"6px", marginBottom:"12px" }}>
          {outputs.map((row, i) => {
            const meta = SEED_FLAVOR[row.seed];
            const qty  = quantity * (Number(row.pct) / 100);
            const netP = Math.max(0, (seedPrices[row.seed]||0) - (listingFeeOn ? LISTING_FEE : 0));
            return (
              <div key={row.id} style={{ display:"grid", gridTemplateColumns:"2fr 90px 1fr 1fr 32px",
                gap:"8px", alignItems:"center",
                background:meta ? meta.bg : "#1a1a2e",
                border:`1px solid ${meta ? meta.border : "#2a2a4a"}`,
                borderRadius:"6px", padding:"7px 10px" }}>
                <select value={row.seed}
                  onChange={e => setOutputs(o => o.map((r,j) => j===i ? {...r,seed:e.target.value} : r))}
                  style={{ background:"transparent", border:"none",
                    color:meta ? meta.label : COL.text, fontWeight:"600", fontSize:"13px", cursor:"pointer" }}>
                  {SEED_TYPES.map(s => <option key={s} value={s}>{s}</option>)}
                </select>
                <div style={{ display:"flex", alignItems:"center", gap:"4px" }}>
                  <input type="number" min="0" max="100" value={row.pct}
                    onChange={e => setOutputs(o => o.map((r,j) => j===i ? {...r,pct:e.target.value} : r))}
                    style={{ background:"transparent", border:"none",
                      borderBottom:`1px solid ${meta ? meta.border : "#2a2a4a"}`,
                      color:meta ? meta.label : COL.text, width:"50px", fontSize:"13px", textAlign:"center" }} />
                  <span style={{ color:COL.muted, fontSize:"12px" }}>%</span>
                </div>
                <div style={{ fontSize:"12px", color:COL.muted, textAlign:"right" }}>
                  {qty%1===0 ? qty.toLocaleString() : qty.toFixed(1)} seeds
                </div>
                <div style={{ fontSize:"12px", textAlign:"right", color:COL.accent }}>
                  @ ${netP.toLocaleString()}{listingFeeOn && <span style={{ fontSize:"10px", color:COL.muted }}> −fee</span>}
                </div>
                <button onClick={() => setOutputs(o => o.filter((_,j) => j!==i))}
                  style={{ background:"transparent", border:"none", color:COL.red, cursor:"pointer", fontSize:"18px", lineHeight:1 }}>×</button>
              </div>
            );
          })}
        </div>

        <div style={{ display:"flex", gap:"14px", alignItems:"center", marginBottom:"18px", flexWrap:"wrap" }}>
          <button onClick={() => setOutputs(o => [...o, { id:Date.now(), seed:SEED_TYPES[0], pct:0 }])}
            style={{ background:"#0a1a2a", border:"1px solid #1a3a5a", borderRadius:"6px",
              color:"#7dd3fc", padding:"6px 14px", fontSize:"12px", cursor:"pointer" }}>
            + Add seed output
          </button>
          <label style={{ fontSize:"12px", color:COL.muted, display:"flex", alignItems:"center", gap:"6px", cursor:"pointer" }}>
            <input type="checkbox" checked={listingFeeOn} onChange={e => setListingFeeOn(e.target.checked)}
              style={{ accentColor:COL.accent, width:"14px", height:"14px" }} />
            Apply $100 listing fee to seed sales
          </label>
        </div>

        {/* Results */}
        <div style={{ borderTop:"1px solid #2a2a4a", paddingTop:"14px" }}>
          <div style={{ display:"grid", gridTemplateColumns:"repeat(4,1fr)", gap:"8px", marginBottom:"12px" }}>
            {[
              { label:"Tool cost",               value:`-$${fmt(results.toolTotal)}`, color:COL.red },
              { label:"Forgone berry sales",      value:`-$${fmt(results.forgone)}`,  color:COL.red },
              { label:"Seed revenue",             value:`$${fmt(results.seedRev)}`,   color:COL.accent },
              { label:"Total cost (incl. opp.)",  value:`-$${fmt(results.totalCost)}`,color:COL.muted },
            ].map(({ label, value, color }) => (
              <div key={label} style={{ background:"#0d0d1f", borderRadius:"6px", padding:"9px 10px" }}>
                <div style={{ fontSize:"10px", color:COL.muted, marginBottom:"3px" }}>{label}</div>
                <div style={{ fontSize:"13px", fontWeight:"600", color }}>{value}</div>
              </div>
            ))}
          </div>
          <div style={{ display:"grid", gridTemplateColumns:"1fr 1fr", gap:"10px" }}>
            {[
              { label:"Net vs tool cost only",  sub:"seed revenue − tool cost",                       val:results.netVsTool },
              { label:"Net vs selling berries", sub:"seed revenue − tool cost − forgone berry sales", val:results.netVsOpp },
            ].map(({ label, sub, val }) => (
              <div key={label} style={{ background:val>=0 ? "#0a1a0a" : "#1a0a0a",
                border:`1px solid ${val>=0 ? "#1a4a1a" : "#4a1a1a"}`, borderRadius:"8px", padding:"12px" }}>
                <div style={{ fontSize:"11px", color:COL.muted, marginBottom:"2px" }}>{label}</div>
                <div style={{ fontSize:"10px", color:"#3a3a5a", marginBottom:"8px" }}>{sub}</div>
                <div style={{ fontSize:"20px", fontWeight:"700", color:val>=0 ? COL.accent : COL.red }}>
                  {val>=0 ? "+" : ""}${fmt(val)}
                </div>
                <div style={{ fontSize:"11px", color:val>=0 ? "#4ade80" : COL.red, marginTop:"4px" }}>
                  {val>=0 ? "✓ Profitable to crack" : "✗ Better to sell berries"}
                </div>
              </div>
            ))}
          </div>
        </div>
      </div>
    );
  }

  // ── App ───────────────────────────────────────────────────────────────────────
  function App() {
    const [seedPrices,         setSeedPrices]         = useState(DEFAULT_SEED_PRICES);
    const [speciesList,        setSpeciesList]        = useState(DEFAULT_SPECIES);
    const [farmers,            setFarmers]            = useState(3);
    const [showSeedEditor,     setShowSeedEditor]     = useState(false);
    const [showSpeciesEditor,  setShowSpeciesEditor]  = useState(false);
    const [showAllBerries,     setShowAllBerries]     = useState(false);
    const [featuredSort,       setFeaturedSort]       = useState("netProfit"); // default: net profit

    const metrics = useMemo(() =>
      speciesList.map(sp => ({ ...sp, ...calcMetrics(sp, seedPrices) })),
      [speciesList, seedPrices]);

    // Overall best by netPer48h
    const sortedAll = [...metrics].sort((a,b) => b.netPer48h - a.netPer48h);
    const overallBest = sortedAll[0];

    // Top base performers per harvest bucket (base price only, no market premium)
    const buckets = { 1: [], 2: [], 3: [] };
    metrics.forEach(m => {
      const d = m.practicalDays;
      if (buckets[d]) buckets[d].push(m);
    });
    const topBase = {};
    [1, 2, 3].forEach(d => {
      topBase[d] = [...buckets[d]].sort((a,b) => b.baseNet48h - a.baseNet48h)[0] || null;
    });

    // Featured rows: in FEATURED_ORDER by default, sortable
    const featuredSet = new Set(FEATURED_ORDER);
    const featuredUnsorted = FEATURED_ORDER
      .map(name => metrics.find(m => m.name === name))
      .filter(Boolean);
    const featuredRows = useMemo(() => {
      const rows = [...featuredUnsorted];
      switch (featuredSort) {
        case "name":       return rows.sort((a,b) => a.name.localeCompare(b.name));
        case "effPrice":   return rows.sort((a,b) => b.effectivePrice - a.effectivePrice);
        case "netProfit":  return rows.sort((a,b) => b.netProfit - a.netProfit);
        case "margin":     return rows.sort((a,b) => b.margin - a.margin);
        case "default":    return FEATURED_ORDER.map(name => rows.find(m => m.name === name)).filter(Boolean);
        default:           return rows;
      }
    }, [metrics, featuredSort]);
    const remainingRows = sortedAll.filter(m => !featuredSet.has(m.name));

    const btnStyle = (active, ac, ab, abg) => ({
      background: active ? abg : COL.card,
      border:`1px solid ${active ? ab : COL.border}`,
      borderRadius:"6px", color:active ? ac : COL.muted,
      padding:"7px 16px", fontSize:"12px", cursor:"pointer",
    });

    return (
      <div style={{ background:COL.bg, minHeight:"100vh", padding:"24px 20px" }}>
        <div style={{ maxWidth:"960px", margin:"0 auto" }}>

          {/* Header */}
          <div style={{ marginBottom:"28px" }}>
            <div style={{ fontSize:"10px", color:COL.muted, letterSpacing:"3px", textTransform:"uppercase", marginBottom:"4px" }}>Farm Profit Calculator</div>
            <h1 style={{ fontSize:"24px", fontWeight:"800", color:COL.accent, marginBottom:"4px" }}>Crop Optimizer</h1>
            <div style={{ fontSize:"12px", color:COL.muted }}>
              156 plots/farmer · all seeds from market · profit normalized per 48h · default market = base +$100 (nets base after fee)
            </div>
          </div>

          {/* Controls */}
          <div style={{ display:"flex", gap:"12px", alignItems:"center", marginBottom:"20px", flexWrap:"wrap" }}>
            <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
              <label style={{ fontSize:"12px", color:COL.muted }}>Farmers:</label>
              <input type="number" value={farmers} min={1}
                onChange={e => setFarmers(Number(e.target.value))}
                style={{ ...fs, width:"70px" }} />
            </div>
            <button onClick={() => setShowSeedEditor(v => !v)}
              style={btnStyle(showSeedEditor,"#7dd3fc","#3a6a9a","#1a2a3a")}>
              {showSeedEditor ? "▲ Hide" : "▼ Edit"} Seed Prices
            </button>
            <button onClick={() => setShowSpeciesEditor(v => !v)}
              style={btnStyle(showSpeciesEditor, COL.purple,"#5a3a9a","#1a1a3a")}>
              {showSpeciesEditor ? "▲ Hide" : "▼ Edit"} Species
            </button>
          </div>

          {/* Seed price editor */}
          {showSeedEditor && (
            <div style={{ background:COL.card, border:"1px solid #1e3a5a", borderRadius:"10px", padding:"18px", marginBottom:"20px" }}>
              <div style={{ fontSize:"11px", color:"#7dd3fc", letterSpacing:"2px", textTransform:"uppercase", marginBottom:"14px" }}>Seed Market Prices</div>
              <SeedPriceEditor seedPrices={seedPrices}
                onChange={(seed, val) => setSeedPrices(p => ({ ...p, [seed]: val }))} />
            </div>
          )}

          {/* Species editor */}
          {showSpeciesEditor && (
            <div style={{ background:COL.card, border:"1px solid #2a1a4a", borderRadius:"10px", padding:"18px", marginBottom:"20px" }}>
              <div style={{ fontSize:"11px", color:COL.purple, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"14px" }}>Species Configuration</div>
              {speciesList.map(sp => (
                <SpeciesEditor key={sp.id} species={sp}
                  onUpdate={updated => setSpeciesList(s => s.map(x => x.id===sp.id ? updated : x))}
                  onRemove={() => setSpeciesList(s => s.filter(x => x.id!==sp.id))} />
              ))}
              <button onClick={() => setSpeciesList(s => [...s, {
                id:Date.now(), name:`Species ${s.length+1}`,
                berriesPerTree:6, basePrice:600, marketPrice:"700",
                growHours:44, harvestDays:2, seeds:{}
              }])} style={{ background:"#0a2a1a", border:"1px solid #1a4a2a", borderRadius:"6px",
                color:COL.accent, padding:"9px 16px", fontSize:"12px", cursor:"pointer", width:"100%" }}>
                + Add Species
              </button>
            </div>
          )}

          {/* ── Top Base Performers ── */}
          <div style={{ background:COL.card, border:`1px solid ${COL.border}`, borderRadius:"10px", padding:"16px", marginBottom:"20px" }}>
            <div style={{ fontSize:"11px", color:COL.gold, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"14px" }}>
              ★ Top Base Price Performers — per harvest cadence (base price only)
            </div>
            <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"12px" }}>
              {[1,2,3].map(d => {
                const m = topBase[d];
                if (!m) return (
                  <div key={d} style={{ background:"#0d0d1f", borderRadius:"8px", padding:"14px", opacity:0.4 }}>
                    <div style={{ fontSize:"10px", color:COL.muted, marginBottom:"6px" }}>{d}-Day Harvest</div>
                    <div style={{ color:COL.muted }}>No berries</div>
                  </div>
                );
                return (
                  <div key={d} style={{ background:"#0d1a0d", border:"1px solid #1a4a1a", borderRadius:"8px", padding:"14px" }}>
                    <div style={{ fontSize:"10px", color:COL.muted, marginBottom:"6px", textTransform:"uppercase", letterSpacing:"1px" }}>{d}-Day Harvest</div>
                    <div style={{ fontSize:"16px", fontWeight:"700", color:COL.accent, marginBottom:"4px" }}>{m.name}</div>
                    <GroupBadge name={m.name} />
                    <div style={{ marginTop:"8px", display:"flex", flexWrap:"wrap", gap:"3px", marginBottom:"8px" }}>
                      {Object.keys(m.seeds).map(seed => <SeedChip key={seed} seed={seed} />)}
                    </div>
                    <div style={{ fontSize:"11px", color:COL.muted }}>Base: <span style={{ color:COL.text }}>${m.basePrice}/berry</span></div>
                    <div style={{ fontSize:"11px", color:COL.muted }}>Berries/tree: <span style={{ color:COL.text }}>{m.berriesPerTree}</span></div>
                    <div style={{ fontSize:"11px", color:COL.muted }}>Seed cost: <span style={{ color:COL.red }}>${fmt(m.seedCost)}</span></div>
                    <div style={{ fontSize:"14px", fontWeight:"700", color:COL.gold, marginTop:"6px" }}>
                      ${fmt(m.baseNet48h)} <span style={{ fontSize:"10px", fontWeight:"400", color:COL.muted }}>net/48h</span>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>

          {/* ── Featured berries table ── */}
          <div style={{ background:COL.card, border:`1px solid ${COL.border}`, borderRadius:"10px", padding:"16px", marginBottom:"4px" }}>
            <div style={{ display:"flex", justifyContent:"space-between", alignItems:"flex-start", marginBottom:"12px", flexWrap:"wrap", gap:"10px" }}>
              <div>
                <div style={{ fontSize:"11px", color:COL.muted, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"4px" }}>
                  Featured Berries — market price
                </div>
                <div style={{ fontSize:"11px", color:"#4a4a6a" }}>
                  {featuredRows.length} featured · default = base +$100, nets base after fee
                </div>
              </div>
              <div style={{ display:"flex", alignItems:"center", gap:"8px" }}>
                <label style={{ fontSize:"11px", color:COL.muted, whiteSpace:"nowrap" }}>Sort by:</label>
                <select value={featuredSort} onChange={e => setFeaturedSort(e.target.value)}
                  style={{ ...fs, width:"auto", padding:"4px 10px", fontSize:"12px",
                    background:"#1a1a2e", border:`1px solid ${featuredSort !== "netProfit" ? COL.purple : COL.border}`,
                    color: featuredSort !== "netProfit" ? COL.purple : COL.text, cursor:"pointer" }}>
                  <option value="netProfit">Net Profit ↓</option>
                  <option value="effPrice">Eff. Price ↓</option>
                  <option value="margin">Margin ↓</option>
                  <option value="name">Berry A→Z</option>
                  <option value="default">Default Order</option>
                </select>
              </div>
            </div>
            <BerryTable rows={featuredRows} bestId={overallBest?.id} />
          </div>

          {/* ── All berries collapsible ── */}
          <div style={{ marginBottom:"20px" }}>
            <button onClick={() => setShowAllBerries(v => !v)}
              style={{ width:"100%", background:showAllBerries ? "#0e0e22" : COL.card,
                border:`1px solid ${showAllBerries ? "#3a3a6a" : COL.border}`,
                borderRadius:showAllBerries ? "0 0 10px 10px" : "0 0 10px 10px",
                color:showAllBerries ? COL.purple : COL.muted,
                padding:"10px 16px", fontSize:"12px", cursor:"pointer",
                display:"flex", justifyContent:"space-between", alignItems:"center" }}>
              <span>{showAllBerries ? "▲ Hide" : "▼ Show"} All Berries ({remainingRows.length} more, sorted by net/48h)</span>
              <span style={{ fontSize:"10px", color:"#4a4a6a" }}>normalized to 48h window</span>
            </button>
            {showAllBerries && (
              <div style={{ background:COL.card, border:`1px solid #2a2a4a`,
                borderTop:"none", borderRadius:"0 0 10px 10px", padding:"16px" }}>
                <BerryTable rows={remainingRows} bestId={overallBest?.id} />
              </div>
            )}
          </div>

          {/* ── Optimal allocation ── */}
          {overallBest && (
            <div style={{ background:"#0a1a0a", border:"1px solid #1a4a1a", borderRadius:"10px", padding:"16px", marginBottom:"20px" }}>
              <div style={{ fontSize:"11px", color:COL.accent, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"12px" }}>
                Optimal Allocation — {farmers} Farmer{farmers!==1?"s":""}
              </div>
              <div style={{ fontSize:"13px", color:COL.muted, marginBottom:"14px" }}>
                Best per 48h: <span style={{ color:COL.accent, fontWeight:"700" }}>{overallBest.name}</span>
                {overallBest.cyclesPer48 > 1 && <span style={{ color:COL.gold }}> · {overallBest.cyclesPer48}× per 48h</span>}
                <span style={{ color:"#86efac" }}> · market ${overallBest.mp} (−$100 = ${overallBest.effectivePrice}/berry)</span>
              </div>
              <div style={{ display:"grid", gridTemplateColumns:"repeat(3,1fr)", gap:"12px" }}>
                {[
                  { label:"Net / farmer per 48h",                value:`$${fmt(overallBest.netPer48h)}` },
                  { label:`Total net · ${farmers} farmers / 48h`, value:`$${fmt(overallBest.netPer48h*farmers)}`, hi:true },
                  { label:"Total seed cost / 48h",               value:`$${fmt(overallBest.seedCost*overallBest.cyclesPer48*farmers)}` },
                ].map(({ label, value, hi }) => (
                  <div key={label} style={{ background:"#0d2a0d", borderRadius:"8px", padding:"12px" }}>
                    <div style={{ fontSize:"10px", color:COL.muted, marginBottom:"5px" }}>{label}</div>
                    <div style={{ fontSize:hi?"20px":"16px", fontWeight:"700", color:hi?COL.gold:COL.accent }}>{value}</div>
                  </div>
                ))}
              </div>
            </div>
          )}

          {/* Seed Cracker */}
          <SeedCracker seedPrices={seedPrices} speciesList={speciesList} />

          {/* Legend */}
          <div style={{ background:COL.card, border:`1px solid ${COL.border}`, borderRadius:"10px", padding:"14px", marginBottom:"20px" }}>
            <div style={{ fontSize:"11px", color:COL.muted, letterSpacing:"2px", textTransform:"uppercase", marginBottom:"10px" }}>Berry Groups</div>
            <div style={{ display:"flex", flexWrap:"wrap", gap:"8px" }}>
              {Object.entries(BERRY_GROUPS).map(([key, g]) => (
                <span key={key} style={{ fontSize:"11px", padding:"3px 10px", borderRadius:"4px",
                  border:`1px solid ${g.color}44`, color:g.color, background:`${g.color}18` }}>
                  {g.label}: {g.berries.join(", ")}
                </span>
              ))}
            </div>
          </div>

          {/* Footer */}
          <div style={{ fontSize:"10px", color:"#3a3a5a", lineHeight:"2" }}>
            PARAMETERS: 156 plots/farmer · 4.5 berries/tree avg · 700 net berries/harvest · 30% Very / 70% Plain seed split · all seeds from market · $100 listing fee applied · default market price = base +$100 (nets base after fee)
            <br />FLAVORS: 🟠 Spicy · 🩷 Sweet · 🟢 Bitter · 🟡 Sour · 🔵 Dry
          </div>

        </div>
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
